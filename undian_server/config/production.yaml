# Konfigurasi produksi untuk deploy di VPS dengan deploy/docker-compose.yaml.
#
# Nilai rahasia TIDAK ditulis di sini. Semuanya diisi lewat environment variable dari
# deploy/.env: SERVERPOD_DATABASE_PASSWORD, SERVERPOD_SERVICE_SECRET, dan
# SERVERPOD_PASSWORD_<nama> untuk password modul auth. Domain publik juga diisi dari
# environment (SERVERPOD_*_PUBLIC_HOST), jadi nilai di bawah hanya cadangan.

# API utama. Di belakang nginx yang menangani HTTPS.
apiServer:
  port: 8080
  publicHost: api.example.com
  publicPort: 443
  publicScheme: https

# Insights hanya bisa diakses dari dalam jaringan Docker (tidak dibuka di nginx).
insightsServer:
  port: 8081
  publicHost: api.example.com
  publicPort: 443
  publicScheme: https

# Web server bawaan Serverpod tidak dipakai; aplikasi web dilayani nginx.
webServer:
  port: 8082
  publicHost: app.example.com
  publicPort: 443
  publicScheme: https

# Database di container "postgres" dalam jaringan Docker yang sama.
database:
  host: postgres
  port: 5432
  name: undian
  user: postgres
  requireSsl: false

redis:
  enabled: false
  host: redis
  port: 6379

maxRequestSize: 524288 # Batas ukuran request dalam byte (logo maks. 300 KB)

sessionLogs:
  consoleEnabled: true
  consoleLogFormat: json
