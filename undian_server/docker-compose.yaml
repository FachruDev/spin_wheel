# Database untuk pengembangan dan tes di laptop. Port hanya dibuka untuk localhost.
# Untuk deploy di VPS gunakan deploy/docker-compose.yaml.
services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: undian
      POSTGRES_PASSWORD: "4rL7RvMe8Q6Tq_tcDVBpQCIp6bkUi3Dv"
    volumes:
      - undian_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:8091:6379"
    command: redis-server --requirepass "-n0KP0kSf4vrrue0v7c2B8kOr2l-Eu4w"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: undian_test
      POSTGRES_PASSWORD: "Vgjab6AQM09aDZO4DD6dH0mX82FxXlRj"
    volumes:
      - undian_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "127.0.0.1:9091:6379"
    command: redis-server --requirepass "l_sol9ZdlfhYZtEcnE7Ob-FTUIWJTWgC"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  undian_data:
  undian_test_data:
