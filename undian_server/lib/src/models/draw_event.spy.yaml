### Satu acara undian, mis. "HUT 2026" atau "RAT Koperasi 2026".
class: DrawEvent
table: draw_event
fields:
  organizationId: int, relation(parent=organization, onDelete=Cascade)
  name: String
  eventDate: DateTime?

