### Hasil satu putaran undian, dikirim ke operator dan layar panggung.
class: DrawResult
fields:
  roundNo: int
  prize: EventPrize

  ### Pemenang berurutan; indeksnya sama dengan [winnerRecords].
  winners: List<EventParticipant>
  winnerRecords: List<PrizeWinner>

  ### Jumlah peserta berhak saat undian.
  poolSize: int

  ### Peserta berhak (maks. 1000, diacak) untuk animasi dan penghitung kandidat di mode Buka NIK.
  poolSample: List<EventParticipant>
